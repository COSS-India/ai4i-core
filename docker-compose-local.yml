version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: ai4v-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c password_encryption=scram-sha-256
      -c listen_addresses='*'
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Run database CLI (migrations, init:external, seed, etc.) inside Docker network
  # so that POSTGRES_HOST=postgres resolves. Uses project root .env so credentials
  # match the postgres container (compose substitutes ${POSTGRES_*} from root .env).
  # Usage:
  #   docker compose -f docker-compose-local.yml run --rm migration-runner python infrastructure/databases/cli.py init:external
  #   ./scripts/run-migration-cli.sh init:external
  migration-runner:
    image: python:3.11-slim
    container_name: ai4v-migration-runner
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AUTH_DB_HOST: postgres
      APP_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network
    entrypoint: ["sh", "-c", "cd /app/infrastructure/databases && pip install -q -r requirements.txt && cd /app && exec \"$$@\"", "sh"]
    command: ["python", "infrastructure/databases/cli.py"]

  redis:
    image: redis:7-alpine
    container_name: ai4v-redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      microservices-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: ai4v-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_USERNAME=${ELASTIC_USERNAME}
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9203:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./infrastructure/elasticsearch:/docker-entrypoint-initdb.d
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -u ${ELASTIC_USERNAME}:${ELASTIC_PASSWORD} -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped


  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ai4v-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ai4v-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      # Default map if KAFKA_LISTENER_SECURITY_PROTOCOL_MAP is not set:
      # map both PLAINTEXT and PLAINTEXT_INTERNAL to PLAINTEXT.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9093:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infrastructure/kafka:/docker-entrypoint-initdb.d
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ai4v-nginx-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./services/api-gateway-service/gateways/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      microservices-network:
        aliases:
          - api-gateway-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: ai4v-auth-service
    ports:
      - "8081:8081"
    environment:
      - ENV_FILE=.env
    env_file:
      - ./services/auth-service/.env
    volumes:
      - ./services/auth-service:/app
      - ./libs/ai4icore_core:/libs/ai4icore_core
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      microservices-network:
        aliases:
          - auth-service
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped



  platform-core-service:
    build:
      context: .
      dockerfile: ./services/platform-core-service/Dockerfile
    container_name: ai4v-platform-core-service
    ports:
      - "8102:8095"
    env_file:
      - ./services/platform-core-service/.env
    environment:
      # ── Override localhost hostnames from .env with Docker service names ──
      - DATABASE_URL=postgresql+asyncpg://ai4iuser:ai4ipassword@postgres:5432/ai4iplatform_core
      - POSTGRES_HOST=postgres
      - APP_DB_HOST=postgres
      - REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth-service:8081
      # ── External GPU service endpoints ──
      - NER_SERVICE_URL=${NER_SERVICE_URL:-http://inference-service:8090/api/v1/ner/inference}
      - PII_LLM_URL=${PII_LLM_URL:-http://inference-service:8090/api/query}
    volumes:
      # Bind-mount app code for hot-reload without image rebuilds
      - ./services/platform-core-service:/app
      - ./libs/ai4icore_core:/libs/ai4icore_core
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8095"
      - "--reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      microservices-network:
        aliases:
          - platform-core-service
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=3)",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped


  simple-ui-frontend:
    build:
      context: ./frontend/simple-ui
      dockerfile: Dockerfile.dev
      args:
        # Browser talks directly to the API Gateway on host port 8080
        # NEXT_PUBLIC_API_URL: https://core-v1.ai4inclusion.org

        NEXT_PUBLIC_API_URL: http://localhost:8080
        # Service-specific API keys from .env file (no hardcoding)
        NEXT_PUBLIC_API_KEY: ${AI4VOICE_API_KEY}
        NEXT_PUBLIC_ASR_API_KEY: ${ASR_API_KEY}
        NEXT_PUBLIC_TTS_API_KEY: ${TTS_API_KEY}
        NEXT_PUBLIC_NMT_API_KEY: ${NMT_API_KEY}
        NEXT_PUBLIC_PIPELINE_API_KEY: ${PIPELINE_API_KEY}
        NEXT_PUBLIC_MODEL_MANAGEMENT_API_KEY: ${MODEL_MANAGEMENT_API_KEY}
        # Telemetry/Observability service URL (logs and traces) - same as API Gateway
        # NEXT_PUBLIC_TELEMETRY_SERVICE_URL: https://core-v1.ai4inclusion.org
        NEXT_PUBLIC_TELEMETRY_SERVICE_URL: http://localhost:8084

    container_name: ai4v-simple-ui
    ports:
      - "3000:3000"
    environment:
      # HOSTNAME=0.0.0.0 tells Next.js standalone server to listen on all interfaces
      - HOSTNAME=0.0.0.0
      # Route all frontend API calls through the API Gateway on host
      # - NEXT_PUBLIC_API_URL=https://core-v1.ai4inclusion.org
      - NEXT_PUBLIC_API_URL=http://localhost:8080

      - NEXT_PUBLIC_API_KEY=${AI4VOICE_API_KEY}
      # Service-specific API keys for API Gateway authentication / RBAC
      - NEXT_PUBLIC_ASR_API_KEY=${ASR_API_KEY}
      - NEXT_PUBLIC_TTS_API_KEY=${TTS_API_KEY}
      - NEXT_PUBLIC_NMT_API_KEY=${NMT_API_KEY}
      - NEXT_PUBLIC_PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - NEXT_PUBLIC_MODEL_MANAGEMENT_API_KEY=${MODEL_MANAGEMENT_API_KEY}
      # Telemetry/Observability service URL (logs and traces) - routed through API Gateway
      # - NEXT_PUBLIC_TELEMETRY_SERVICE_URL=https://core-v1.ai4inclusion.org
    env_file:
      - ./.env
    volumes:
      - ./frontend/simple-ui:/app
      - /app/node_modules
      - /app/.next
    networks:
      microservices-network:
        aliases:
          - simple-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Observability: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ai4v-prometheus
    ports:
      - "9090:9090"
    # Make `host.docker.internal` resolve to the host gateway so Prometheus
    # can scrape services running natively on the host (e.g. inference-service
    # during local development). Works on Docker Engine 20.10+ and Docker Desktop.
    extra_hosts:
      - "inference-service:host-gateway"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      # - '--web.external-url=https://core-v1.ai4inclusion.org/prometheus/'
      - '--web.external-url=http://localhost:9090'
      - '--web.route-prefix=/'
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 10s
      retries: 3

  # Observability: Alertmanager (POC)
  # Mount directory; bootstrap copies alertmanager.default.yml to alertmanager.yml if missing
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: ai4v-alertmanager
    ports:
      - "9095:9093"
    volumes:
      - ./infrastructure/alertmanager:/etc/alertmanager
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /etc/alertmanager/alertmanager.yml ]; then
          cp /etc/alertmanager/alertmanager.default.yml /etc/alertmanager/alertmanager.yml;
        fi;
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
    # Resolve `inference-service` to the host gateway so Alertmanager can POST the
    # alert-history webhook back to platform-core when it runs natively on the host
    # (mirrors the prometheus block's alias used for scraping host services).
    extra_hosts:
      - "inference-service:host-gateway"
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: ai4v-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}

      # Combined from both HEAD and remote commits
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_DOMAIN=core-v1.ai4inclusion.org
      - GF_SERVER_ROOT_URL=https://core-v1.ai4inclusion.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

    env_file:
      - ./.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - microservices-network
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: ai4v-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s


  # Telemetry: OpenSearch (for logs)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: ai4v-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./infrastructure/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9204:9200"
      - "9600:9600"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # OpenSearch initialization - ensures index template is created on startup
  opensearch-init:
    image: curlimages/curl:latest
    container_name: ai4v-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - microservices-network
    volumes:
      - ./infrastructure/opensearch/init-opensearch.sh:/init-opensearch.sh:ro
      - ./infrastructure/opensearch/index-template.json:/index-template.json:ro
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - TEMPLATE_FILE=/index-template.json
    command: ["sh", "/init-opensearch.sh"]
    restart: "no"

  # Telemetry: OpenSearch Dashboards (for log visualization)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: ai4v-opensearch-dashboards
    ports:
      - "5602:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      # - SERVER_BASEPATH=/opensearch
      # - SERVER_REWRITEBASEPATH=true
    networks:
      - microservices-network
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Telemetry: Jaeger (for distributed tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ai4v-jaeger
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP collector
      - "6831:6831/udp"  # UDP agent
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - QUERY_BASE_PATH=/jaeger
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Telemetry: Fluent Bit (for log collection)
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: ai4v-fluent-bit
    env_file:
      - ./.env
    # Log filtering configuration is read from .env file (no hardcoding)
    # - EXCLUDE_INIT_LOGS: Filter initialization/noise logs (startup messages)
    #   Set to "true" to exclude service initialization logs (e.g., "Service started successfully",
    #   "Registered service with service registry", "Plugin initialized", etc.)
    #   This prevents logs with trace_ids that don't exist in Jaeger from appearing in OpenSearch Dashboards
    #   Example: EXCLUDE_INIT_LOGS=true
    # - INCLUDE_SERVICE_LOGS: Service allowlist (comma-separated list of services to keep)
    #   Example: INCLUDE_SERVICE_LOGS=asr,tts,ocr,ner,nmt,llm,pipeline,transliteration,language-detection,language-diarization,audio-lang-detection,speaker-diarization,auth
    #   If not set, all logs are kept (no filtering)
    volumes:
      - ./infrastructure/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./infrastructure/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./infrastructure/fluent-bit/extract_context.lua:/fluent-bit/scripts/extract_context.lua:ro
      - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers:ro
      # - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - microservices-network
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped



volumes:
  postgres-data:
    driver: local
    # Note: Removed bind mount to Linux-specific path for Windows compatibility
    # Data will persist in Docker's managed volume location
    # To use a custom path on Linux, uncomment and adjust the driver_opts below:
    #driver_opts:
      #type: "none"
     # o: "bind"
     # device: "/home/ubuntu/ai4i-v/volumes/pg_data"

  redis-data:
    driver: local
  elasticsearch-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  opensearch-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  microservices-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
