services:

  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    # Core baseline — no profile, so it starts on a bare `docker compose up`.
    image: postgres:15-alpine
    container_name: ai4v-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c password_encryption=scram-sha-256
      -c listen_addresses='*'
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    # Core baseline — see postgres above.
    image: redis:7-alpine
    container_name: ai4v-redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      microservices-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Gateway ───────────────────────────────────────────────────────────────────

  nginx-gateway:
    # Frontend-only: the gateway is what the simple-ui browser app calls into,
    # so it only needs to run when the UI is up.
    profiles: ["frontend"]
    image: nginx:alpine
    container_name: ai4v-nginx-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-network
    restart: unless-stopped

  # ── Messaging ─────────────────────────────────────────────────────────────────

  zookeeper:
    # Profiles: kafka is a hard dep of zookeeper; both serve trace transport
    # (logging profile) and arbitrary streaming (streaming profile). Either
    # profile brings the pair up.
    profiles: ["logging", "streaming"]
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ai4v-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  kafka:
    # Profiles: shared by logging (fluent-bit consumes trace spans from
    # kafka-topic-otel-trace) and the standalone streaming profile.
    profiles: ["logging", "streaming"]
    image: confluentinc/cp-kafka:7.4.0
    container_name: ai4v-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9093:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infrastructure/kafka:/docker-entrypoint-initdb.d
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── Metrics ───────────────────────────────────────────────────────────────────

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: ai4v-prometheus
    ports:
      - "9090:9090"
    # Allows Prometheus to scrape services running natively on the host
    extra_hosts:
      - "inference-service:host-gateway"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://localhost:9090'
      - '--web.route-prefix=/'
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.26.0
    container_name: ai4v-alertmanager
    user: root
    ports:
      - "9095:9093"
    volumes:
      - ./infrastructure/alertmanager:/etc/alertmanager
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /etc/alertmanager/alertmanager.yml ]; then
          cp /etc/alertmanager/alertmanager.default.yml /etc/alertmanager/alertmanager.yml;
        fi;
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
    # Allows Alertmanager to POST alert-history webhooks to platform-core running on the host
    extra_hosts:
      - "inference-service:host-gateway"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: ai4v-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - microservices-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:v1.7.0
    container_name: ai4v-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Logging ───────────────────────────────────────────────────────────────────

  opensearch:
    profiles: ["logging"]
    image: opensearchproject/opensearch:2.11.0
    container_name: ai4v-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./infrastructure/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9204:9200"
      - "9600:9600"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  opensearch-init:
    profiles: ["logging"]
    image: curlimages/curl:latest
    container_name: ai4v-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - microservices-network
    volumes:
      - ./infrastructure/opensearch/init-opensearch.sh:/init-opensearch.sh:ro
      - ./infrastructure/opensearch/index-template.json:/index-template.json:ro
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - TEMPLATE_FILE=/index-template.json
    command: ["sh", "/init-opensearch.sh"]
    restart: "no"

  opensearch-dashboards:
    profiles: ["logging"]
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: ai4v-opensearch-dashboards
    ports:
      - "5602:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - microservices-network
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  fluent-bit:
    profiles: ["logging"]
    image: fluent/fluent-bit:latest
    container_name: ai4v-fluent-bit
    env_file:
      - ./.env
    volumes:
      - ./infrastructure/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./infrastructure/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./infrastructure/fluent-bit/extract_context.lua:/fluent-bit/scripts/extract_context.lua:ro
      - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - microservices-network
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Application Services ─────────────────────────────────────────────────────
  # The service .env files (services/*/.env) target a native-on-host workflow,
  # so they default internal hostnames to "localhost". The `environment:` blocks
  # below override only those host fields with docker-network DNS names; every
  # other setting still comes from env_file.
  #
  # simple-ui-frontend also requires the AI4Voice API keys to be set in the root
  # .env (ASR_API_KEY, AI4VOICE_API_KEY, TTS_API_KEY, NMT_API_KEY,
  # PIPELINE_API_KEY, MODEL_MANAGEMENT_API_KEY).

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: ai4v-auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./services/auth-service/.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]
    # Bind-mount the source tree so uvicorn --reload picks up host-side edits.
    volumes:
      - ./services/auth-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      microservices-network:
        aliases:
          - auth-service
    restart: unless-stopped

  platform-core-service:
    build:
      context: .
      dockerfile: ./services/platform-core-service/Dockerfile
    container_name: ai4v-platform-core-service
    ports:
      - "8095:8095"
    env_file:
      - ./services/platform-core-service/.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8095", "--reload"]
    # Bind-mount the source tree so uvicorn --reload picks up host-side edits.
    volumes:
      - ./services/platform-core-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      microservices-network:
        aliases:
          - platform-core-service
    restart: unless-stopped

  inference-service:
    build:
      context: .
      dockerfile: ./services/inference-service/Dockerfile
    container_name: ai4v-inference-service
    ports:
      - "8090:8090"
    env_file:
      - ./services/inference-service/.env
    # Override the Dockerfile's `ENTRYPOINT ["python", "main.py"]` so the dev
    # container runs uvicorn with --reload, matching auth-service and
    # platform-core-service.
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8090", "--reload"]
    # Bind-mount the source tree so uvicorn --reload picks up host-side edits.
    volumes:
      - ./services/inference-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      microservices-network:
        aliases:
          - inference-service
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────────────────
  # Dev mode (Dockerfile.dev): runs `npm ci` at image build and `npx next dev`
  # at container start — same as `npm install` + `npm run dev` on the host.

  simple-ui-frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend/simple-ui
      dockerfile: Dockerfile.dev
    container_name: ai4v-simple-ui
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/simple-ui/.env
    volumes:
      - ./frontend/simple-ui:/app
      - /app/node_modules
      - /app/.next
    networks:
      microservices-network:
        aliases:
          - simple-ui
    restart: unless-stopped


volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  opensearch-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  microservices-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
