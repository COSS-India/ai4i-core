[project]
name = "ai4icore-email"
version = "1.0.0"
description = "AI4ICore Email - provider-agnostic transactional email client (SMTP today, pluggable for SendGrid/Mailgun/etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI4X Team"},
    {email = "team@ai4x.com"}
]
keywords = ["email", "smtp", "ses", "sendgrid", "ai4icore"]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosmtplib>=3.0.0,<4.0.0",
    "jinja2>=3.1.0,<4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai4icore_email", "ai4icore_email.providers"]
