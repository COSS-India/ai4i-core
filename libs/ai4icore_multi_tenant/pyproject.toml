[project]
name = "ai4icore-multi-tenant"
version = "1.0.0"
description = "AI4ICore Multi-Tenant Plugin - shared tenant context, schema routing, and DB session for AI4ICore services"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI4X Team"},
    {email = "team@ai4x.com"}
]
keywords = ["multi-tenant", "tenant", "fastapi", "enterprise", "ai4icore"]
dependencies = [
    "fastapi>=0.104.0",
    "starlette>=0.27.0",
    "httpx>=0.25.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai4icore_multi_tenant"]
