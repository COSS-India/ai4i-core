[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4icore-core"
version = "1.0.0"
description = "Consolidated core library for AI4I-Core microservices: exceptions, env config, structured logging, JWT auth, observability, telemetry, model management, service base, email, and bootstrap."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AI4I Team", email = "team@ai4inclusion.org" },
]
maintainers = [
    { name = "AI4I Team", email = "team@ai4inclusion.org" },
]
keywords = ["ai4i", "microservices", "fastapi", "auth", "logging", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Union of all merged sub-package dependencies.
dependencies = [
    # Foundation (exceptions, env, constants)
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.27.0",

    # Logging
    "python-json-logger>=2.0.7",
    "kafka-python>=2.0.2",
    "aiokafka>=0.8.0",

    # Auth
    "httpx>=0.25.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.0",
    "redis>=5.0.0",
    "PyJWT>=2.8.0",

    # Bootstrap
    "sqlalchemy[asyncio]>=2.0.0",
    "slowapi>=0.1.9",

    # Observability
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",

    # Telemetry (OpenTelemetry distributed tracing)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "packaging>=21.0",

    # Model management
    "tritonclient[http]>=2.40.0",
    "numpy>=1.24.0",

    # Service base
    "python-dotenv>=1.0.0",

    # Email
    "aiosmtplib>=3.0.0,<4.0.0",
    "jinja2>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/COSS-India/ai4i-core"
Repository = "https://github.com/COSS-India/ai4i-core"
Issues = "https://github.com/COSS-India/ai4i-core/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ai4icore_core*"]
