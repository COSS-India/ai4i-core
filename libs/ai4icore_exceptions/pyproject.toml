[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4icore-exceptions"
version = "1.0.0"
description = "Shared exception hierarchy, response envelope, and exception handlers for AI4I-Core"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["ai4icore_exceptions*"]
