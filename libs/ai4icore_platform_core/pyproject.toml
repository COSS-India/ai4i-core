[project]
name = "ai4icore-platform-core"
version = "1.0.0+shim"
description = "Backwards-compatibility shim — re-exports ai4icore_core.platform_core. New code should import ai4icore-core directly."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI4I Team", email = "team@ai4inclusion.org"}
]
dependencies = [
    "ai4icore-core>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai4icore_platform_core"]
