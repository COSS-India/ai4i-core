[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4icore-constants"
version = "1.0.0"
description = "Shared error messages and constants for AI4I-Core services. Pure static data, zero behavior deps."
requires-python = ">=3.10"

[project.optional-dependencies]
# Only needed if importing from ai4icore_constants.exceptions (backward compat)
compat = ["ai4icore-exceptions>=1.0.0"]

[tool.setuptools.packages.find]
include = ["ai4icore_constants*"]
