[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4icore-constants"
version = "1.0.0"
description = "Shared error messages and constants for AI4I-Core services"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ai4icore_constants*"]
