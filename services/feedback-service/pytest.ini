[pytest]
# Pytest configuration for feedback-service

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: all async test functions are treated as asyncio coroutines
asyncio_mode = auto

markers =
    unit: Pure unit tests with no I/O
    integration: Tests that exercise HTTP routes (DB/PII/LLM are mocked)

log_cli = true
log_cli_level = WARNING

addopts = -v --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
