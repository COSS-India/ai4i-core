# Service API Docs Registry
# Each service entry has a spec_url pointing to its live /openapi.json endpoint.
# optional: false → log ERROR if unreachable, still don't crash
# optional: true  → log WARNING if unreachable, skip silently
# API_GATEWAY_URL is read from .env via settings — do not set it here.

categories:

  ai-inference:
    label: "AI Inference"
    optional: false
    services:
      asr-service:
        label: "ASR"
        description: "Automatic Speech Recognition"
        spec_url: "http://asr-service:8087/openapi.json"
      ner-service:
        label: "NER"
        description: "Named Entity Recognition"
        spec_url: "http://ner-service:9001/openapi.json"
      ocr-service:
        label: "OCR"
        description: "Optical Character Recognition"
        spec_url: "http://ocr-service:8099/openapi.json"
      nmt-service:
        label: "NMT"
        description: "Neural Machine Translation"
        spec_url: "http://nmt-service:8089/openapi.json"
      tts-service:
        label: "TTS"
        description: "Text to Speech"
        spec_url: "http://tts-service:8088/openapi.json"
      llm-service:
        label: "LLM"
        description: "Large Language Model"
        spec_url: "http://llm-service:8090/openapi.json"
      transliteration-service:
        label: "Transliteration"
        description: "Script Transliteration"
        spec_url: "http://transliteration-service:8090/openapi.json"
      language-detection-service:
        label: "Language Detection"
        description: "Detect language from text"
        spec_url: "http://language-detection-service:8090/openapi.json"
      language-diarization-service:
        label: "Language Diarization"
        description: "Language diarization in audio"
        spec_url: "http://language-diarization-service:8090/openapi.json"
      speaker-diarization-service:
        label: "Speaker Diarization"
        description: "Speaker diarization in audio"
        spec_url: "http://speaker-diarization-service:8095/openapi.json"
      audio-lang-detection-service:
        label: "Audio Language Detection"
        description: "Language detection from audio"
        spec_url: "http://audio-lang-detection-service:8096/openapi.json"
      pipeline-service:
        label: "Pipeline"
        description: "Multi-service pipeline orchestration"
        spec_url: "http://pipeline-service:8090/openapi.json"

  platform:
    label: "Platform"
    optional: false
    services:
      auth-service:
        label: "Auth"
        description: "Authentication, JWT, API Keys, Roles"
        spec_url: "http://auth-service:8081/openapi.json"
      platform-core-service:
        label: "Platform Core"
        description: "Model Management, Services Registry"
        spec_url: "http://platform-core-service:8095/openapi.json"
      policy-service:
        label: "Policy"
        description: "PII Policy Management"
        spec_url: "http://policy-service:8099/openapi.json"

  infrastructure:
    label: "Infrastructure"
    optional: true
    services:
      smr-service:
        label: "SMR"
        description: "Smart Model Router"
        spec_url: "http://smr-service:8097/openapi.json"
      pii-guard-service:
        label: "PII Guard"
        description: "PII Detection and Redaction"
        spec_url: "http://pii-guard-service:8000/openapi.json"

  observability:
    label: "Observability"
    optional: true
    services:
      telemetry-service:
        label: "Telemetry"
        description: "OTel Traces, OpenSearch"
        spec_url: "http://telemetry-service:8084/openapi.json"
      metrics-service:
        label: "Metrics"
        description: "Prometheus Metrics"
        spec_url: "http://metrics-service:8083/openapi.json"
      dashboard-service:
        label: "Dashboard"
        description: "Dashboards"
        spec_url: "http://dashboard-service:8086/openapi.json"
      alerting-service:
        label: "Alerting"
        description: "Alert Rules and Notifications"
        spec_url: "http://alerting-service:8085/openapi.json"
      alert-management-service:
        label: "Alert Management"
        description: "Alert Definitions Management"
        spec_url: "http://alert-management-service:8098/openapi.json"
