# APISIX standalone (file-driven) config; listen on 8080.
apisix:
  node_listen: 8080
  enable_ipv6: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Enable the Prometheus plugin globally on all routes.
# plugin_attr configures the export endpoint; the plugins list below ensures
# the plugin is loaded by APISIX. In standalone/YAML mode, also add a
# global_rules entry in apisix.yaml so every route emits apisix_http_status.
plugins:
  - prometheus

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
