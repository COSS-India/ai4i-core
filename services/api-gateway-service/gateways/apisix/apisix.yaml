  priority: 80
  methods:
  - POST
  - OPTIONS
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      nmt-service${APISIX_UPSTREAM_SUFFIX}:8089: 1
    pass_host: pass
    type: roundrobin
  plugins:
    response-rewrite:
      body_base64: false
      headers:
        X-Service: nmt-service
    serverless-pre-function:
      functions:
      - return function(conf, ctx) local sid = ngx.var.http_x_anonymous_session_id;
        if sid and sid ~= '' then ngx.req.set_header('X-Try-It-RateLimit-Key', sid)
        else ngx.req.set_header('X-Try-It-RateLimit-Key', ngx.var.remote_addr or 'unknown')
        end; end
      phase: rewrite
    cors:
      allow_origins: ${APISIX_PUBLIC_ORIGIN}
      allow_methods: POST,OPTIONS
      max_age: 3600
      allow_headers: Accept,Accept-Version,Content-Length,Content-MD5,Content-Type,Date,X-Auth-Token,Authorization,X-API-Key,x-api-key,apikey,x-auth-source,X-Auth-Source,request-startTime,Request-StartTime,Request-Starttime,X-Anonymous-Session-Id,X-Try-It,sec-ch-ua,sec-ch-ua-mobile,sec-ch-ua-platform,Referer
      expose_headers: X-Auth-Token,X-Service,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,RateLimit-Limit,RateLimit-Remaining,RateLimit-Reset
      allow_credential: true
    proxy-rewrite:
      headers:
        set:
          X-Try-It: 'true'
          X-Gateway: apisix
    limit-count:
      count: 5
      key: http_x_try_it_ratelimit_key
      rejected_msg: Please login to access other services.
      policy: local
      key_type: var
      rejected_code: 403
      show_limit_quota_header: true
      allow_degradation: false
      time_window: 3600
