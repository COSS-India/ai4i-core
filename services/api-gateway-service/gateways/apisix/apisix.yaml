- uri: /
  name: root-route
  priority: 1
  methods:
  - GET
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      simple-ui${APISIX_UPSTREAM_SUFFIX}:3000: 1
    pass_host: pass
    type: roundrobin
- uri: /*
  name: root-static-files
  priority: 8
  methods:
  - GET
  - HEAD
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      simple-ui${APISIX_UPSTREAM_SUFFIX}:3000: 1
    pass_host: pass
    type: roundrobin
  plugins:
    proxy-rewrite:
      headers:
        X-Gateway: apisix
      use_real_request_uri_unsafe: false
  vars:
  - - uri
    - ~~
    - \.(svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot|css|js|json|xml|txt|pdf)$
- uri: /_next/*
  name: nextjs-static
  priority: 10
  methods:
  - GET
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      simple-ui${APISIX_UPSTREAM_SUFFIX}:3000: 1
    pass_host: pass
    type: roundrobin
- uri: /api/v1/alerts/*
  name: alerts-route
  priority: 210
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - PATCH
  - OPTIONS
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      alert-management-service${APISIX_UPSTREAM_SUFFIX}:8098: 1
    pass_host: pass
    type: roundrobin
  plugins:
    serverless-pre-function:
      phase: rewrite
      functions:
      - "return function(conf, ctx)\n  ngx.req.set_header(\"X-User-Id\", nil)\nend\n"
    forward-auth:
      uri: http://auth-service${APISIX_UPSTREAM_SUFFIX}:8081/api/v1/auth/validate
      request_headers:
      - Authorization
      - X-API-Key
      - x-api-key
      - apikey
      upstream_headers:
      - X-User-ID
      client_headers:
      - WWW-Authenticate
      timeout: 3000
      keepalive: true
      keepalive_timeout: 60000
      keepalive_pool: 5
    cors:
      allow_origins: ${APISIX_PUBLIC_ORIGIN}
      allow_methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      max_age: 3600
      allow_headers: Accept,Accept-Version,Content-Length,Content-MD5,Content-Type,Date,X-Auth-Token,Authorization,X-API-Key,x-api-key,apikey,x-auth-source,X-Auth-Source,request-startTime,Request-StartTime,Request-Starttime
      expose_headers: X-Auth-Token,X-Correlation-ID,X-Request-ID
      allow_credential: true
    proxy-rewrite:
      regex_uri:
      - ^/api/v1/alerts/(.*)
      - /alerts/$1
      headers:
        add:
          X-Correlation-ID: $request_id
          X-Gateway: apisix
      use_real_request_uri_unsafe: false
    response-rewrite:
      body_base64: false
      headers:
        X-Served-By: APISIX-Gateway
        X-Service: alert-management-service
    limit-count:
      policy: local
      key_type: var
      rejected_code: 429
      show_limit_quota_header: true
      key: http_x_user_id
      time_window: 60
      allow_degradation: false
      count: 200
    serverless-post-function:
      phase: header_filter
      functions:
      - "return function(conf, ctx)\n  if ngx.status == 500 and not ngx.header[\"X-Service\"]
        then\n    ngx.status = 503\n    ngx.header[\"Content-Type\"] = \"application/json;
        charset=utf-8\"\n    ngx.header[\"X-Auth-Error\"] = \"auth-service-unavailable\"\n
        \ end\nend\n"
