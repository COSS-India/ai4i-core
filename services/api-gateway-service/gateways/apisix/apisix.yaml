# APISIX Routes Configuration (environment-agnostic)
# Generated from apisix.yaml.template via substitute-env.sh at container start.
# Configure: APISIX_PUBLIC_ORIGIN, APISIX_UPSTREAM_SUFFIX (see README).
#
routes:
- uri: /
  name: root-route
  priority: 1
  methods:
  - GET
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      simple-ui${APISIX_UPSTREAM_SUFFIX}:3000: 1
    pass_host: pass
    type: roundrobin
- uri: /*
  name: root-static-files
  priority: 8
  methods:
  - GET
  - HEAD
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      simple-ui${APISIX_UPSTREAM_SUFFIX}:3000: 1
    pass_host: pass
    type: roundrobin
  plugins:
    proxy-rewrite:
      headers:
        X-Gateway: apisix
      use_real_request_uri_unsafe: false
  vars:
  - - uri
    - ~~
    - \.(svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot|css|js|json|xml|txt|pdf)$
- uri: /_next/*
  name: nextjs-static
  priority: 10
  methods:
  - GET
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      simple-ui${APISIX_UPSTREAM_SUFFIX}:3000: 1
    pass_host: pass
    type: roundrobin
- uri: /api/v1/alerts/*
  name: alerts-route

  priority: 210
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - PATCH
  - OPTIONS
  upstream:
    hash_on: vars
    scheme: http
    nodes:
      alert-management-service${APISIX_UPSTREAM_SUFFIX}:8098: 1
    pass_host: pass
    type: roundrobin
  plugins:
    cors:
      allow_origins: ${APISIX_PUBLIC_ORIGIN}
      allow_methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      max_age: 3600
      allow_headers: Accept,Accept-Version,Content-Length,Content-MD5,Content-Type,Date,X-Auth-Token,Authorization,X-API-Key,x-api-key,apikey,x-auth-source,X-Auth-Source,request-startTime,Request-StartTime,Request-Starttime
      expose_headers: X-Auth-Token,X-Correlation-ID,X-Request-ID
      allow_credential: true
    proxy-rewrite:
      regex_uri:
      - ^/api/v1/alerts/(.*)
      - /alerts/$1
      headers:
        X-Correlation-ID: $request_id
        X-Gateway: apisix
      use_real_request_uri_unsafe: false
    response-rewrite:
      body_base64: false
      headers:
        X-Served-By: APISIX-Gateway
        X-Service: alert-management-service
    limit-count:
      policy: local
      key_type: var
      rejected_code: 429
      show_limit_quota_header: true
      key: remote_addr
      time_window: 60
      allow_degradation: false
      count: 200
