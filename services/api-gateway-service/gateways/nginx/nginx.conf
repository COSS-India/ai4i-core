worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        # Docker embedded DNS: resolve upstream hostnames at request time so nginx can start
        # when some compose services are not running (static resolution fails at startup).
        resolver 127.0.0.11 ipv6=off valid=10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location ^~ /api/v1/auth/ {
            set $upstream_auth http://auth-service:8081;
            proxy_pass $upstream_auth$request_uri;
        }
        location ^~ /api/v1/asr/ {
            set $upstream_asr http://asr-service:8087;
            proxy_pass $upstream_asr$request_uri;
        }
        location ^~ /api/v1/tts/ {
            set $upstream_tts http://tts-service:8088;
            proxy_pass $upstream_tts$request_uri;
        }
        location ^~ /api/v1/nmt/ {
            set $upstream_nmt http://nmt-service:8089;
            proxy_pass $upstream_nmt$request_uri;
        }
        location ^~ /api/v1/llm/ {
            set $upstream_llm http://llm-service:8090;
            proxy_pass $upstream_llm$request_uri;
        }
        location ^~ /api/v1/model-management/ {
            set $upstream_mm http://model-management-service:8091;
            proxy_pass $upstream_mm$request_uri;
        }
        location ^~ /api/v1/pipeline/ {
            set $upstream_pl http://pipeline-service:8090;
            proxy_pass $upstream_pl$request_uri;
        }
        location ^~ /api/v1/config/ {
            set $upstream_cfg http://config-service:8082;
            proxy_pass $upstream_cfg$request_uri;
        }
        location ^~ /api/v1/feature-flags/ {
            set $upstream_ff http://config-service:8082;
            proxy_pass $upstream_ff$request_uri;
        }
        location ^~ /api/v1/registry/ {
            set $upstream_reg http://config-service:8082;
            proxy_pass $upstream_reg$request_uri;
        }
        location = /api/v1/multi-tenant { return 301 /api/v1/multi-tenant/; }
        location ^~ /api/v1/multi-tenant/ {
            set $upstream_mt http://multi-tenant-service:8001;
            rewrite ^/api/v1/multi-tenant/(.*)$ /$1 break;
            proxy_pass $upstream_mt;
        }
        location ^~ /api/v1/telemetry/ {
            set $upstream_tel http://telemetry-service:8084;
            proxy_pass $upstream_tel$request_uri;
        }
        location ^~ /api/v1/observability/ {
            set $upstream_obs http://telemetry-service:8084;
            proxy_pass $upstream_obs$request_uri;
        }
        location = /api/v1/alerts { return 301 /api/v1/alerts/; }
        location ^~ /api/v1/alerts/ {
            set $upstream_alerts http://alert-management-service:8098;
            rewrite ^/api/v1/alerts/(.*)$ /alerts/$1 break;
            proxy_pass $upstream_alerts;
        }
        location ^~ /api/v1/transliteration/ {
            set $upstream_tr http://transliteration-service:8090;
            proxy_pass $upstream_tr$request_uri;
        }
        location ^~ /api/v1/language-detection/ {
            set $upstream_ld http://language-detection-service:8090;
            proxy_pass $upstream_ld$request_uri;
        }
        location ^~ /api/v1/language-diarization/ {
            set $upstream_lrd http://language-diarization-service:8090;
            proxy_pass $upstream_lrd$request_uri;
        }
        location ^~ /api/v1/speaker-diarization/ {
            set $upstream_sd http://speaker-diarization-service:8095;
            proxy_pass $upstream_sd$request_uri;
        }
        location ^~ /api/v1/audio-lang-detection/ {
            set $upstream_ald http://audio-lang-detection-service:8096;
            proxy_pass $upstream_ald$request_uri;
        }
        location ^~ /api/v1/ocr/ {
            set $upstream_ocr http://ocr-service:8099;
            proxy_pass $upstream_ocr$request_uri;
        }
        location ^~ /api/v1/ner/ {
            set $upstream_ner http://ner-service:9001;
            proxy_pass $upstream_ner$request_uri;
        }
        location ^~ /api/v1/pii/ {
            set $upstream_pii http://pii-guard-service:8000;
            proxy_pass $upstream_pii$request_uri;
        }
        location ^~ /api/v1/policy-engine/ {
            set $upstream_pol http://policy-engine:8095;
            rewrite ^/api/v1/policy-engine/(.*)$ /$1 break;
            proxy_pass $upstream_pol;
        }
        location ^~ /api/v1/pay-per-use/ {
            set $upstream_ppu http://pay-per-use-service:8006;
            rewrite ^/api/v1/pay-per-use/(.*)$ /$1 break;
            proxy_pass $upstream_ppu;
        }
        location ^~ /api/v1/try-it {
            set $upstream_tryit http://nmt-service:8089;
            proxy_pass $upstream_tryit$request_uri;
        }

        location ^~ /socket.io/asr {
            set $upstream_sio_asr http://asr-service:8087;
            proxy_pass $upstream_sio_asr$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /socket.io/tts {
            set $upstream_sio_tts http://tts-service:8088;
            proxy_pass $upstream_sio_tts$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location / {
            return 404;
        }
    }
}
