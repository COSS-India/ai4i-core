worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50m;

    sendfile on;
    keepalive_timeout 65;

    # Resolve upstream hostnames at runtime, not at startup.
    # Docker's embedded DNS is at 127.0.0.11. The 'valid' parameter
    # controls how long resolved addresses are cached (30s).
    # This is what prevents nginx from crashing when a service is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── CORS map ──
    # Map origin to allowed values for local development
    map $http_origin $cors_header {
        default '';
        "~^http://localhost:3000$" $http_origin;
        "~^http://localhost:8085$" $http_origin;
        "~^http://127.0.0.1:3000$" $http_origin;
        "~^http://127.0.0.1:8085$" $http_origin;
    }

    server {
        listen 8080;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip client-supplied identity headers — only the gateway sets these,
        # populated from the auth_request response below. Without this, a
        # client could spoof X-User-Id / X-Tenant-Id and impersonate users.
        proxy_set_header X-User-Id   "";
        proxy_set_header X-Tenant-Id "";

        # ── CORS ──
        # Strip upstream CORS headers so nginx is the sole authority.
        # Without this, FastAPI's CORSMiddleware AND nginx both set these
        # headers, giving browsers duplicate values which they reject.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header 'Access-Control-Allow-Origin' $cors_header always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
        add_header 'Access-Control-Allow-Headers' 'Accept, Accept-Version, Content-Length, Content-MD5, Content-Type, Date, X-Auth-Token, Authorization, X-API-Key, X-Request-ID, X-Correlation-ID, X-Request-Start-Time, Request-Start-Time, request-startTime' always;
        add_header 'Access-Control-Expose-Headers' 'X-Auth-Token, X-User-Id, X-Tenant-Id, X-Request-ID, X-Correlation-ID, X-Process-Time' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '3600' always;

        # Short-circuit preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── Gateway auth (mirrors apisix forward-auth in prod) ──
        # Every request triggers a subrequest to /__auth_validate which calls
        # auth-service /api/v1/auth/validate. Validate decides public vs
        # protected via api_permissions.json and returns 200/401/403.
        # Locations that should bypass set `auth_request off;`.
        auth_request     /__auth_validate;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;
        proxy_set_header X-User-Id   $auth_user_id;
        proxy_set_header X-Tenant-Id $auth_tenant_id;

        location = /__auth_validate {
            internal;
            # Runtime DNS via variable (matches the upstream pattern used below).
            set $auth_validate_url http://auth-service:8081/api/v1/auth/validate;
            proxy_pass $auth_validate_url;
            proxy_pass_request_body off;
            proxy_set_header Content-Length    "";
            proxy_set_header Host              $host;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-API-Key         $http_x_api_key;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI    $request_uri;
        }

        location = /health {
            auth_request off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # ── Service proxies ──
        # Using variables forces nginx to resolve DNS at request time
        # instead of startup. If a service is down, the request gets
        # a 502 but nginx itself stays running.

        set $upstream_auth          http://auth-service:8081;
        set $upstream_asr           http://asr-service:8087;
        set $upstream_tts           http://tts-service:8088;
        set $upstream_nmt           http://nmt-service:8089;
        set $upstream_llm           http://llm-service:8090;
        set $upstream_model_mgmt    http://platform-core-service:8095;
        set $upstream_pipeline      http://pipeline-service:8090;
        set $upstream_config        http://config-service:8082;
        set $upstream_telemetry     http://telemetry-service:8084;
        # Alerts merged into platform-core (was alert-management-service:8098).
        set $upstream_alert_mgmt    http://platform-core-service:8095;
        set $upstream_translit      http://transliteration-service:8090;
        set $upstream_langdetect    http://language-detection-service:8090;
        set $upstream_langdiar      http://language-diarization-service:8090;
        set $upstream_speakerdiar   http://speaker-diarization-service:8095;
        set $upstream_audiolang     http://audio-lang-detection-service:8096;
        set $upstream_ocr           http://ocr-service:8099;
        set $upstream_ner           http://ner-service:9001;
        set $upstream_pii           http://pii-guard-service:8000;
        set $upstream_policy        http://policy-service:8099;
        set $upstream_docs          http://docs-manager-service:8103;

        # /validate is the auth subrequest target itself — bypass auth_request to avoid recursion.
        location = /api/v1/auth/validate { auth_request off; proxy_pass $upstream_auth; }
        # JWKS is public (clients need it before they have a token).
        location = /api/v1/auth/.well-known/jwks.json { auth_request off; proxy_pass $upstream_auth; }
        location ^~ /api/v1/auth/ { proxy_pass $upstream_auth; }
        location ^~ /api/v1/tenants/ { proxy_pass $upstream_auth; }
        location = /api/v1/tenants { proxy_pass $upstream_auth; }
        location ^~ /api/v1/asr/ { proxy_pass $upstream_asr; }
        location ^~ /api/v1/tts/ { proxy_pass $upstream_tts; }
        location ^~ /api/v1/nmt/ { proxy_pass $upstream_nmt; }
        location ^~ /api/v1/llm/ { proxy_pass $upstream_llm; }
        # Backward-compat bridge: old model-management prefix -> platform-core paths.
        location ^~ /api/v1/model-management/ {
            rewrite ^/api/v1/model-management/models(.*)$ /api/v1/models$1 break;
            rewrite ^/api/v1/model-management/services(.*)$ /api/v1/services$1 break;
            proxy_pass $upstream_model_mgmt;
        }
        location ^~ /api/v1/models/ { proxy_pass $upstream_model_mgmt; }
        location = /api/v1/models { proxy_pass $upstream_model_mgmt; }
        location ^~ /api/v1/services/ { proxy_pass $upstream_model_mgmt; }
        location = /api/v1/services { proxy_pass $upstream_model_mgmt; }
        location ^~ /api/v1/billing/ { proxy_pass $upstream_model_mgmt; }
        location = /api/v1/billing { proxy_pass $upstream_model_mgmt; }
        location ^~ /api/v1/pay-per-use/ { proxy_pass $upstream_model_mgmt; }
        location = /api/v1/pay-per-use { proxy_pass $upstream_model_mgmt; }
        location ^~ /api/v1/pipeline/ { proxy_pass $upstream_pipeline; }
        location ^~ /api/v1/config/ { proxy_pass $upstream_config; }
        location ^~ /api/v1/feature-flags/ { proxy_pass $upstream_config; }
        location ^~ /api/v1/registry/ { proxy_pass $upstream_config; }
        location ^~ /api/v1/telemetry/ { proxy_pass $upstream_telemetry; }
        location ^~ /api/v1/observability/ { proxy_pass $upstream_telemetry; }
        location = /api/v1/alerts { return 301 /api/v1/alerts/; }
        # Alertmanager posts alert history here — no user token, so skip auth.
        location = /api/v1/alerts/history/webhook { auth_request off; proxy_pass $upstream_alert_mgmt; }
        # platform-core serves alert routes at /api/v1/alerts/ — no path rewrite.
        location ^~ /api/v1/alerts/ {
            proxy_pass $upstream_alert_mgmt;
        }
        location ^~ /api/v1/transliteration/ { proxy_pass $upstream_translit; }
        location ^~ /api/v1/language-detection/ { proxy_pass $upstream_langdetect; }
        location ^~ /api/v1/language-diarization/ { proxy_pass $upstream_langdiar; }
        location ^~ /api/v1/speaker-diarization/ { proxy_pass $upstream_speakerdiar; }
        location ^~ /api/v1/audio-lang-detection/ { proxy_pass $upstream_audiolang; }
        location ^~ /api/v1/ocr/ { proxy_pass $upstream_ocr; }
        location ^~ /api/v1/ner/ { proxy_pass $upstream_ner; }
        location ^~ /api/v1/pii/ { proxy_pass $upstream_pii; }
        # Policy service matches platform convention (/api/v1/policy-service/*).
        location ^~ /api/v1/policy-service/ { proxy_pass $upstream_policy; }
        location ^~ /api/v1/try-it { proxy_pass $upstream_nmt; }

        # Websockets bypass auth_request — local-dev convenience; prod uses apisix.
        location ^~ /socket.io/asr {
            auth_request off;
            proxy_pass $upstream_asr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /socket.io/tts {
            auth_request off;
            proxy_pass $upstream_tts;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /docs {
            auth_request off;
            proxy_pass $upstream_docs;
        }
        location = /openapi.json {
            auth_request off;
            proxy_pass $upstream_docs;
        }
        location ^~ /specs/ {
            auth_request off;
            proxy_pass $upstream_docs;
        }

        location / {
            auth_request off;
            return 404;
        }
    }
}
