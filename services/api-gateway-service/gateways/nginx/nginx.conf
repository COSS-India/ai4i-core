worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50m;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location ^~ /api/v1/auth/ { proxy_pass http://auth-service:8081; }
        location ^~ /api/v1/asr/ { proxy_pass http://asr-service:8087; }
        location ^~ /api/v1/tts/ { proxy_pass http://tts-service:8088; }
        location ^~ /api/v1/nmt/ { proxy_pass http://nmt-service:8089; }
        location ^~ /api/v1/llm/ { proxy_pass http://llm-service:8090; }
        location ^~ /api/v1/model-management/ { proxy_pass http://model-management-service:8091; }
        location ^~ /api/v1/pipeline/ { proxy_pass http://pipeline-service:8090; }
        location ^~ /api/v1/config/ { proxy_pass http://config-service:8082; }
        location ^~ /api/v1/feature-flags/ { proxy_pass http://config-service:8082; }
        location ^~ /api/v1/registry/ { proxy_pass http://config-service:8082; }
        location = /api/v1/multi-tenant { return 301 /api/v1/multi-tenant/; }
        location ^~ /api/v1/multi-tenant/ { proxy_pass http://multi-tenant-service:8001/; }
        location ^~ /api/v1/telemetry/ { proxy_pass http://telemetry-service:8084; }
        location ^~ /api/v1/observability/ { proxy_pass http://telemetry-service:8084; }
        location = /api/v1/alerts { return 301 /api/v1/alerts/; }
        location ^~ /api/v1/alerts/ { proxy_pass http://alert-management-service:8098/alerts/; }
        location ^~ /api/v1/transliteration/ { proxy_pass http://transliteration-service:8090; }
        location ^~ /api/v1/language-detection/ { proxy_pass http://language-detection-service:8090; }
        location ^~ /api/v1/language-diarization/ { proxy_pass http://language-diarization-service:8090; }
        location ^~ /api/v1/speaker-diarization/ { proxy_pass http://speaker-diarization-service:8095; }
        location ^~ /api/v1/audio-lang-detection/ { proxy_pass http://audio-lang-detection-service:8096; }
        location ^~ /api/v1/ocr/ { proxy_pass http://ocr-service:8099; }
        location ^~ /api/v1/ner/ { proxy_pass http://ner-service:9001; }
        location ^~ /api/v1/pii/ { proxy_pass http://pii-guard-service:8000; }
        location ^~ /api/v1/try-it { proxy_pass http://nmt-service:8089; }

        location ^~ /socket.io/asr {
            proxy_pass http://asr-service:8087;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /socket.io/tts {
            proxy_pass http://tts-service:8088;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /docs {
            proxy_pass http://docs-manager-service:8103;
        }
        location = /openapi.json {
            proxy_pass http://docs-manager-service:8103;
        }
        location ^~ /specs/ {
            proxy_pass http://docs-manager-service:8103;
        }

        location / {
            return 404;
        }
    }
}
