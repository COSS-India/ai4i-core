worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50m;

    sendfile on;
    keepalive_timeout 65;

    # Resolve upstream hostnames at runtime, not at startup.
    # Docker's embedded DNS is at 127.0.0.11. The 'valid' parameter
    # controls how long resolved addresses are cached (30s).
    # This is what prevents nginx from crashing when a service is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # ── Service proxies ──
        # Using variables forces nginx to resolve DNS at request time
        # instead of startup. If a service is down, the request gets
        # a 502 but nginx itself stays running.

        set $upstream_auth          http://auth-service:8081;
        set $upstream_asr           http://asr-service:8087;
        set $upstream_tts           http://tts-service:8088;
        set $upstream_nmt           http://nmt-service:8089;
        set $upstream_llm           http://llm-service:8090;
        set $upstream_model_mgmt    http://model-management-service:8091;
        set $upstream_pipeline      http://pipeline-service:8090;
        set $upstream_config        http://config-service:8082;
        set $upstream_multi_tenant  http://multi-tenant-service:8001;
        set $upstream_telemetry     http://telemetry-service:8084;
        set $upstream_alert_mgmt    http://alert-management-service:8098;
        set $upstream_translit      http://transliteration-service:8090;
        set $upstream_langdetect    http://language-detection-service:8090;
        set $upstream_langdiar      http://language-diarization-service:8090;
        set $upstream_speakerdiar   http://speaker-diarization-service:8095;
        set $upstream_audiolang     http://audio-lang-detection-service:8096;
        set $upstream_ocr           http://ocr-service:8099;
        set $upstream_ner           http://ner-service:9001;
        set $upstream_pii           http://pii-guard-service:8000;
        set $upstream_policy        http://policy-service:8099;
        set $upstream_docs          http://docs-manager-service:8103;

        location ^~ /api/v1/auth/ { proxy_pass $upstream_auth; }
        location ^~ /api/v1/asr/ { proxy_pass $upstream_asr; }
        location ^~ /api/v1/tts/ { proxy_pass $upstream_tts; }
        location ^~ /api/v1/nmt/ { proxy_pass $upstream_nmt; }
        location ^~ /api/v1/llm/ { proxy_pass $upstream_llm; }
        location ^~ /api/v1/model-management/ { proxy_pass $upstream_model_mgmt; }
        location ^~ /api/v1/pipeline/ { proxy_pass $upstream_pipeline; }
        location ^~ /api/v1/config/ { proxy_pass $upstream_config; }
        location ^~ /api/v1/feature-flags/ { proxy_pass $upstream_config; }
        location ^~ /api/v1/registry/ { proxy_pass $upstream_config; }
        location = /api/v1/multi-tenant { return 301 /api/v1/multi-tenant/; }
        location ^~ /api/v1/multi-tenant/ {
            rewrite ^/api/v1/multi-tenant/(.*) /$1 break;
            proxy_pass $upstream_multi_tenant;
        }
        location ^~ /api/v1/telemetry/ { proxy_pass $upstream_telemetry; }
        location ^~ /api/v1/observability/ { proxy_pass $upstream_telemetry; }
        location = /api/v1/alerts { return 301 /api/v1/alerts/; }
        location ^~ /api/v1/alerts/ {
            rewrite ^/api/v1/alerts/(.*) /alerts/$1 break;
            proxy_pass $upstream_alert_mgmt;
        }
        location ^~ /api/v1/transliteration/ { proxy_pass $upstream_translit; }
        location ^~ /api/v1/language-detection/ { proxy_pass $upstream_langdetect; }
        location ^~ /api/v1/language-diarization/ { proxy_pass $upstream_langdiar; }
        location ^~ /api/v1/speaker-diarization/ { proxy_pass $upstream_speakerdiar; }
        location ^~ /api/v1/audio-lang-detection/ { proxy_pass $upstream_audiolang; }
        location ^~ /api/v1/ocr/ { proxy_pass $upstream_ocr; }
        location ^~ /api/v1/ner/ { proxy_pass $upstream_ner; }
        location ^~ /api/v1/pii/ { proxy_pass $upstream_pii; }
        # Policy service matches platform convention (/api/v1/policy-service/*).
        location ^~ /api/v1/policy-service/ { proxy_pass $upstream_policy; }
        location ^~ /api/v1/try-it { proxy_pass $upstream_nmt; }

        location ^~ /socket.io/asr {
            proxy_pass $upstream_asr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /socket.io/tts {
            proxy_pass $upstream_tts;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /docs {
            proxy_pass $upstream_docs;
        }
        location = /openapi.json {
            proxy_pass $upstream_docs;
        }
        location ^~ /specs/ {
            proxy_pass $upstream_docs;
        }

        location / {
            return 404;
        }
    }
}
