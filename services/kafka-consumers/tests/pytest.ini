; Pytest configuration for kafka-consumers.  Lives here, not at the service root,
; because every test asset for this service lives under tests/.
;
; That makes tests/ the rootdir, so INVOKE WITH A PATH:
;
;     python -m pytest tests/unit                 # from the service root
;     cd tests && python -m pytest                # equivalent
;
; pytest discovers this file by walking up from the path argument, so no -c is
; needed when a path under tests/ is given.  A BARE `pytest` from the service root
; finds no config, gets no asyncio_mode and no testpaths, and would try to collect
; .venv — always pass the path.
;
; asyncio_mode = auto is not inherited from anywhere: the repo's only other pytest
; config is the repo-root tests/pytest.ini, which applies to the cross-service
; suite only.  Without it every async test here needs an explicit
; @pytest.mark.asyncio.
[pytest]
asyncio_mode = auto

; Relative to this file's directory (the rootdir).  The unit suite is the whole
; of the testing scope: it needs no broker, no database and no Redis, so it runs
; on every commit and inside the image build.
testpaths = unit

python_files = test_*.py
python_classes = Test*
python_functions = test_*

; --strict-markers is load-bearing, not tidiness: a mistyped marker in a `-m`
; selection would silently match NOTHING, and a run that executes zero tests
; still exits 0 unless something catches it.
addopts = --strict-markers
markers =
    slow: takes appreciably longer than the rest of the suite
