[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[INPUT]
    Name              kafka
    Tag               otel.traces
    Brokers           kafka:9092
    Topics            kafka-topic-otel-trace
    Group_Id          fluent-bit-docker-compose
    Offset_Key        kafka_offset

[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch
    Port              9200
    Index             docker-logs
    Type              _doc
    Suppress_Type_Name On
    Logstash_Format   On
    Logstash_Prefix   docker-logs
    Replace_Dots      On
    Retry_Limit       False

[OUTPUT]
    Name              opensearch
    Match             otel.traces
    Host              opensearch
    Port              9200
    Index             docker-traces
    Type              _doc
    Suppress_Type_Name On
    Logstash_Format   On
    Logstash_Prefix   docker-traces
    Replace_Dots      On
    Retry_Limit       False
