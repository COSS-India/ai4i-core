[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Tracing spans from host apps / inference → kafka-topic-otel-trace.
# Format json so each message is parsed; nest lift exposes span fields.
[INPUT]
    Name              kafka
    Tag               otel.trace
    Brokers           kafka:9092
    Topics            kafka-topic-otel-trace
    Group_Id          fluent-bit-docker-compose
    Format            json
    Offset_Key        kafka_offset

# in_kafka wraps each message as {topic,partition,offset,key,payload}; the span
# JSON is under `payload`. Lift it so name/context/attributes are top-level.
[FILTER]
    Name         nest
    Match        otel.trace
    Operation    lift
    Nested_under payload

# Platform-core queries logs-* (OPENSEARCH_LOGS_INDEX) and traces-* (OPENSEARCH_INDEX).
[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch
    Port              9200
    Index             logs
    Suppress_Type_Name On
    Logstash_Format   On
    Logstash_Prefix   logs
    Logstash_DateFormat %Y.%m.%d
    Retry_Limit       5

[OUTPUT]
    Name              opensearch
    Match             otel.trace
    Host              opensearch
    Port              9200
    Index             traces
    Suppress_Type_Name On
    Logstash_Format   On
    Logstash_Prefix   traces
    Logstash_DateFormat %Y.%m.%d
    Retry_Limit       5
    Generate_ID       On
