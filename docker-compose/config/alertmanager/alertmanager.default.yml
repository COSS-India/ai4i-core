# Bootstrap config for fresh clone. No secrets — alert-config-sync-service overwrites
# with full config from DB. alertmanager.yml is gitignored — seed on the host before
# starting Alertmanager (do not rely on an in-container copy; image runs as nobody):
#   cp config/alertmanager/alertmanager.default.yml config/alertmanager/alertmanager.yml
global:
  resolve_timeout: 5m
route:
  receiver: default-admin
  group_by: [alertname, category, severity, tenant]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
receivers:
  - name: default-admin
    webhook_configs:
      - url: http://alert-management-service:8098/alerts/history/webhook
inhibit_rules: []
