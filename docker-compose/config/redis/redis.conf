# Redis 8 — local Docker Compose (AOF + RDB, allkeys-lru)
# Password is injected at runtime via --requirepass from REDIS_PASSWORD.

maxmemory 512mb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

bind 0.0.0.0
protected-mode yes
timeout 300
tcp-keepalive 300

databases 16
notify-keyspace-events Ex
maxclients 10000

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

loglevel notice
