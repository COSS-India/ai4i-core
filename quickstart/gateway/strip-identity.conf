# Public route: no validation, and any identity headers the client sent are dropped.
proxy_set_header Host                       $host;
proxy_set_header X-Real-IP                  $remote_addr;
proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
proxy_set_header X-User-ID                  "";
proxy_set_header X-Tenant-ID                "";
proxy_set_header X-Tenant-Name              "";
proxy_set_header X-Permission-IDs           "";
proxy_set_header X-API-Key-ID               "";
proxy_set_header X-Application-ID           "";
proxy_set_header X-Tier-ID                  "";
proxy_set_header X-Auth-Type                "";
proxy_set_header X-Rate-Limit               "";
proxy_set_header X-Quota-Exhausted-Services "";
