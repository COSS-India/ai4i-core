# Quick start gateway: one origin (http://localhost:8080) for the portal and the API.
#
# In production APISIX sits in front of the services. It asks auth-service to
# validate each request (forward-auth) and passes the caller's identity to the
# backend as X-User-ID, X-Tenant-ID, X-Tenant-Name and X-Permission-IDs. The
# backends trust those headers, so something has to play that role locally.
# This file does it with nginx auth_request.
#
# Routing mirrors the local dev proxy, which is the maintained copy:
# frontend/simple-ui/src/pages/api/v1/[...proxy].ts (resolveRoute). When a
# route is added there, add it here too.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Resolving per request (variables below) keeps the
    # gateway working when a backend container restarts and gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s upstream=$upstream_addr';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server {
        listen 8080;

        set $auth_service      http://auth-service:8081;
        set $platform_core     http://platform-core-service:8095;
        set $inference_service http://inference-service:8090;
        set $portal            http://simple-ui:3000;

        # ── Forward-auth: the same call APISIX makes ────────────────────────
        location = /_auth_validate {
            internal;
            proxy_pass $auth_service/api/v1/auth/validate;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Auth: public routes (login, register, refresh, ...) ─────────────
        location ~ ^/api/v1/auth/(login|register|refresh|guest|verify-email|resend-verification|forgot-password|reset-password|set-password|resend-setup-link|validate|oauth)(/|$|\?) {
            include /etc/nginx/strip-identity.conf;
            proxy_pass $auth_service;
        }

        # ── Auth: everything else needs a valid token ───────────────────────
        location /api/v1/auth/ {
            include /etc/nginx/forward-auth.conf;
            proxy_pass $auth_service;
        }

        # ── Platform-core health namespace: public ──────────────────────────
        location /api/v1/platform-core/ {
            include /etc/nginx/strip-identity.conf;
            proxy_pass $platform_core;
        }

        # ── Anonymous try-it routes ─────────────────────────────────────────
        location ~ ^/api/v1/(nmt/try-it|llm/try-it|services/try-it-service-list|model-management/services/try-it-service-list)(/|$|\?) {
            include /etc/nginx/strip-identity.conf;
            proxy_pass $platform_core;
        }

        # ── Inference routes ────────────────────────────────────────────────
        location ~ ^/api/v1/((inference|nmt|asr|tts|ner|transliteration|language-detection|audio-lang-detection|speaker-diarization|language-diarization|ocr|chat)(/|$)|pii/(simulate|analyze|anonymize|entities)(/|$)) {
            include /etc/nginx/forward-auth.conf;
            # LLM responses can stream; pass each chunk straight through.
            proxy_buffering off;
            proxy_cache off;
            proxy_pass $inference_service;
        }

        # ── Everything else under /api/v1 is platform-core, authenticated ───
        location /api/v1/ {
            include /etc/nginx/forward-auth.conf;
            proxy_pass $platform_core;
        }

        # ── The portal (Next.js), including its own /api/config and /api/health
        location / {
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass $portal;
        }

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ── Rejected by forward-auth: return auth-service's own answer ──────
        # Reached from forward-auth.conf's error_page. Repeats the validation
        # call as a normal proxy, so the client gets auth-service's status
        # (401, 403, 429) and its JSON error body, not nginx's.
        location @auth_rejected {
            proxy_pass $auth_service/api/v1/auth/validate;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
