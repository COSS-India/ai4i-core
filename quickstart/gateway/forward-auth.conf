# Validate the caller with auth-service, then pass its identity to the backend.
#
# Every header /api/v1/auth/validate returns is forwarded, as APISIX does.
# inference-service stamps X-API-Key-ID, X-Application-ID and X-Tier-ID onto the
# request span, and the pay-per-use consumer bills against them; without them a
# request is billed to no key and no tier.
#
# proxy_set_header replaces any copy the client sent, so identity cannot be spoofed.
auth_request /_auth_validate;
auth_request_set $x_user_id          $upstream_http_x_user_id;
auth_request_set $x_tenant_id        $upstream_http_x_tenant_id;
auth_request_set $x_tenant_name      $upstream_http_x_tenant_name;
auth_request_set $x_permission_ids   $upstream_http_x_permission_ids;
auth_request_set $x_api_key_id       $upstream_http_x_api_key_id;
auth_request_set $x_application_id   $upstream_http_x_application_id;
auth_request_set $x_tier_id          $upstream_http_x_tier_id;
auth_request_set $x_auth_type        $upstream_http_x_auth_type;
auth_request_set $x_rate_limit       $upstream_http_x_rate_limit;
auth_request_set $x_quota_exhausted  $upstream_http_x_quota_exhausted_services;

proxy_set_header Host                       $host;
proxy_set_header X-Real-IP                  $remote_addr;
proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
proxy_set_header X-User-ID                  $x_user_id;
proxy_set_header X-Tenant-ID                $x_tenant_id;
proxy_set_header X-Tenant-Name              $x_tenant_name;
proxy_set_header X-Permission-IDs           $x_permission_ids;
proxy_set_header X-API-Key-ID               $x_api_key_id;
proxy_set_header X-Application-ID           $x_application_id;
proxy_set_header X-Tier-ID                  $x_tier_id;
proxy_set_header X-Auth-Type                $x_auth_type;
proxy_set_header X-Rate-Limit               $x_rate_limit;
proxy_set_header X-Quota-Exhausted-Services $x_quota_exhausted;

# nginx only understands 401 and 403 from auth_request and turns anything else
# (429 budget or quota exhausted, for one) into a 500. On any of the three,
# ask auth-service again and return its real status and error body, the way
# APISIX passes a forward-auth rejection through. Backend errors are not
# affected: proxy_intercept_errors is off, so they pass through untouched.
error_page 401 403 500 = @auth_rejected;
