# Quick start log shipping.
#
# Application containers use Docker's fluentd logging driver, which sends each
# log line here over the forward protocol. That works the same on Linux and on
# Docker Desktop, unlike tailing /var/lib/docker/containers, which Docker
# Desktop does not expose to containers. `docker compose logs` keeps working
# because Docker also keeps a local copy of every line.
#
# Parsers and the Lua helpers are reused from infrastructure/fluent-bit/.
# Unlike that config, the endpoint allow-list (filter_dashboard_logs) is not
# applied, so every JSON log line from the platform is searchable locally.

[SERVICE]
    Flush         2
    Daemon        off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Tag_Prefix        docker.

# Inference spans (the same topic the pay-per-use consumer reads) go to traces-*.
[INPUT]
    Name              kafka
    Brokers           kafka:9092
    Topics            kafka-topic-otel-trace
    Group_Id          quickstart-fluent-bit
    poll_ms           500
    Format            json
    Tag               otel.trace

[FILTER]
    Name                grep
    Match               docker.*
    Regex               log ^\{

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              json
    Reserve_Data        On
    Preserve_Key        Off

[FILTER]
    Name                nest
    Match               docker.*
    Operation           lift
    Nested_under        context

[FILTER]
    Name                modify
    Match               docker.*
    Condition           Key_exists status_code
    Rename              status_code statusCode

[FILTER]
    Name                modify
    Match               docker.*
    Add                 collector fluent-bit

[FILTER]
    Name                lua
    Match               docker.*
    Script              /fluent-bit/scripts/extract_context.lua
    Call                extract_context_fields

[OUTPUT]
    Name  opensearch
    Match docker.*
    Host  opensearch
    Port  9200
    Logstash_Format On
    Logstash_Prefix logs
    Logstash_DateFormat %Y.%m.%d
    Retry_Limit 5
    Suppress_Type_Name On

[FILTER]
    Name         nest
    Match        otel.trace
    Operation    lift
    Nested_under payload

[OUTPUT]
    Name  opensearch
    Match otel.trace
    Host  opensearch
    Port  9200
    Logstash_Format On
    Logstash_Prefix traces
    Logstash_DateFormat %Y.%m.%d
    Retry_Limit 5
    Suppress_Type_Name On
    Generate_ID On
