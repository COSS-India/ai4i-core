# AI4I-Orchestrator quick start.
#
#   docker compose -f quickstart/docker-compose.yml up -d
#
# Then open http://localhost:8080. See quickstart/README.md.
#
# For local exploration only. Secrets are fixed and published (quickstart.env),
# and every port is bound to 127.0.0.1. Never deploy this file.
#
# This file lives in its own directory on purpose: Compose reads .env from the
# compose file's directory, so the repository root .env (used by
# docker-compose-local.yml) cannot change the project name or the volumes here.

name: ai4i-quickstart

x-app-env: &app-env
  env_file:
    - quickstart.env

# Application logs go to fluent-bit, which indexes them in OpenSearch.
# fluentd-async lets a container start even before fluent-bit is listening.
x-logging: &shipped-logs
  logging:
    driver: fluentd
    options:
      fluentd-address: "127.0.0.1:${QS_FLUENT_PORT:-24224}"
      fluentd-async: "true"
      tag: "{{.Name}}"

x-python-health: &python-health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:

  # ── Data stores ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai4i
      POSTGRES_PASSWORD: ai4i-quickstart
      POSTGRES_DB: ai4i_platform_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai4i -d ai4i_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "ai4i-quickstart", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ai4i-quickstart --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates the databases, runs every Alembic migration and seeds the default
  # admin, then exits. Re-running it on an existing volume is a no-op.
  migrate:
    <<: *app-env
    image: ghcr.io/coss-india/ai4i-quickstart-migrate:${AI4I_VERSION:-latest}
    build:
      context: ..
      dockerfile: quickstart/migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # ── Messaging (metering) ──────────────────────────────────────────────────
  # Single-node Kafka in KRaft mode, no ZooKeeper. Inference request spans go
  # through it to the pay-per-use consumer, which writes the usage rows the
  # Usage Dashboard reads.

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Creates the topics up front so consumers never subscribe to a missing topic.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in kafka-topic-otel-trace notification.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    restart: "no"

  # ── Platform services ─────────────────────────────────────────────────────

  auth-service:
    <<: [*app-env, *shipped-logs]
    image: ghcr.io/coss-india/ai4i-auth-service:${AI4I_VERSION:-latest}
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      PORT: "8081"
    volumes:
      # Keeps the JWT signing keys across restarts, so a restart does not log
      # everyone out.
      - auth-keys:/app/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/v1/auth/health', timeout=4)"]
    restart: unless-stopped

  platform-core-service:
    <<: [*app-env, *shipped-logs]
    image: ghcr.io/coss-india/ai4i-platform-core-service:${AI4I_VERSION:-latest}
    build:
      context: ..
      dockerfile: services/platform-core-service/Dockerfile
    environment:
      SERVICE_NAME: platform-core-service
      PORT: "8095"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/api/v1/platform-core/health', timeout=4)"]
    restart: unless-stopped

  inference-service:
    <<: [*app-env, *shipped-logs]
    image: ghcr.io/coss-india/ai4i-inference-service:${AI4I_VERSION:-latest}
    build:
      context: ..
      dockerfile: services/inference-service/Dockerfile
    environment:
      SERVICE_NAME: inference-service
      PORT: "8090"
    depends_on:
      platform-core-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=4)"]
    restart: unless-stopped

  payperuse-consumer:
    <<: [*app-env, *shipped-logs]
    image: ghcr.io/coss-india/ai4i-kafka-consumers:${AI4I_VERSION:-latest}
    build:
      context: ../services/kafka-consumers
    command: ["--consumer", "payperuse_consumer"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  simple-ui:
    image: ghcr.io/coss-india/ai4i-simple-ui:${AI4I_VERSION:-latest}
    build:
      context: ../frontend/simple-ui
    environment:
      # Empty API_URL: the browser calls /api/v1 on the same origin, the gateway.
      API_URL: ""
      PLATFORM_NAME: AI4I Orchestrate
      ENABLED_TASK_TYPES: llm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Plays APISIX's role: validates the token with auth-service and passes the
  # caller's identity to the backends. One origin for the portal and the API.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${QS_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/forward-auth.conf:/etc/nginx/forward-auth.conf:ro
      - ./gateway/strip-identity.conf:/etc/nginx/strip-identity.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      platform-core-service:
        condition: service_healthy
      inference-service:
        condition: service_healthy
      simple-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # A tiny OpenAI-compatible model that echoes the prompt. Register it as an
  # LLM service with endpoint http://mock-llm:8000 to try inference offline.
  mock-llm:
    image: python:3.11-slim
    command: ["python", "/app/mock_llm.py"]
    volumes:
      - ./mock-llm/mock_llm.py:/app/mock_llm.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:${QS_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${QS_OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - ../infrastructure/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Applies the logs index template and retention policy, then exits.
  opensearch-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      TEMPLATE_FILE: /index-template.json
      ISM_POLICY_FILE: /ism-policy-logs.json
    volumes:
      - ../infrastructure/opensearch/init-opensearch.sh:/init-opensearch.sh:ro
      - ../infrastructure/opensearch/index-template.json:/index-template.json:ro
      - ../infrastructure/opensearch/ism-policy-logs.json:/ism-policy-logs.json:ro
    command: ["sh", "/init-opensearch.sh"]
    restart: "no"

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    ports:
      # The Docker daemon, not a container, connects here (fluentd log driver).
      - "127.0.0.1:${QS_FLUENT_PORT:-24224}:24224"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../infrastructure/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ../infrastructure/fluent-bit/extract_context.lua:/fluent-bit/scripts/extract_context.lua:ro
    depends_on:
      opensearch:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Optional extras: docker compose --profile extras ... up -d ────────────

  grafana:
    profiles: ["extras"]
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${QS_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  opensearch-dashboards:
    profiles: ["extras"]
    image: opensearchproject/opensearch-dashboards:2.11.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${QS_OSD_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  auth-keys:
  prometheus-data:
  opensearch-data:
  grafana-data:
