# Quick start Prometheus.
#
# inference-service is the only platform service that exposes metrics, at
# /enterprise/metrics (ai4i_core.observability). The job name matches
# infrastructure/prometheus/prometheus.yml so the provisioned Grafana
# dashboards and platform-core's PromQL work unchanged.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "ai4i-core"
    environment: "quickstart"

scrape_configs:
  - job_name: "ai4icore-enterprise"
    metrics_path: /enterprise/metrics
    static_configs:
      - targets:
          - "inference-service:8090"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '([^:]+):(\d+)'
        target_label: service
        replacement: '${1}'

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
