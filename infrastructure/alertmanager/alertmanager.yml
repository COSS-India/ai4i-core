global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: bharathia0704@gmail.com
  smtp_auth_username: bharathia0704@gmail.com
  smtp_auth_password: ${SMTP_PASSWORD}
  smtp_require_tls: true
route:
  group_by:
  - alertname
  - category
  - severity
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: default-admin
  routes: []
receivers:
- name: default-admin
  email_configs: []
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - category
