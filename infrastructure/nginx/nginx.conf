events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server host.docker.internal:8081;
    }

    upstream platform_core_service {
        server host.docker.internal:8095;
    }

    upstream inference_service {
        server host.docker.internal:8090;
    }

    map $request_method $cors_method {
        OPTIONS 1;
        default 0;
    }

    server {
        listen 8080;

        # auth_request issues its subrequest as GET, so $request_method inside
        # /_auth_validate would read GET, not the client's method. Capture the
        # real method here on the main request (server-rewrite phase runs before
        # the auth_request access phase) so the subrequest can forward it.
        set $original_method $request_method;

        # ── Auth validation subrequest ──
        # Mirrors perf APISIX forward-auth: passes Authorization, X-Original-URI
        # and X-Original-Method so auth-service can resolve the endpoint's
        # required permission. Without X-Original-Method the permission check is
        # skipped and the validate timing log records an empty upstream_method.
        location = /_auth_validate {
            internal;
            proxy_pass http://auth_service/api/v1/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $original_method;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # ── Public auth routes (no token required) ──
        location ~ ^/api/v1/auth/(login|register|refresh|guest|verify-email|resend-verification|forgot-password|reset-password|set-password|resend-setup-link|validate|oauth) {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers $http_access_control_request_headers;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Protected auth routes ──
        location /api/v1/auth/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers $http_access_control_request_headers;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth_validate;
            auth_request_set $x_user_id                  $upstream_http_x_user_id;
            auth_request_set $x_tenant_id                $upstream_http_x_tenant_id;
            auth_request_set $x_permission_ids           $upstream_http_x_permission_ids;
            auth_request_set $x_user_plan                $upstream_http_x_user_plan;
            auth_request_set $x_auth_type                $upstream_http_x_auth_type;
            auth_request_set $x_budget_exhausted         $upstream_http_x_budget_exhausted;
            auth_request_set $x_quota_exhausted          $upstream_http_x_quota_exhausted;
            auth_request_set $x_quota_exhausted_services $upstream_http_x_quota_exhausted_services;

            proxy_pass http://auth_service;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-User-ID                 $x_user_id;
            proxy_set_header X-Tenant-ID               $x_tenant_id;
            proxy_set_header X-Permission-IDs          $x_permission_ids;
            proxy_set_header X-User-Plan               $x_user_plan;
            proxy_set_header X-Auth-Type               $x_auth_type;
            proxy_set_header X-Budget-Exhausted        $x_budget_exhausted;
            proxy_set_header X-Quota-Exhausted         $x_quota_exhausted;
            proxy_set_header X-Quota-Exhausted-Services $x_quota_exhausted_services;
        }

        # ── Public platform-core health route ──
        location /api/v1/platform-core/ {
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;

            proxy_pass http://platform_core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Inference service routes (runs natively on host port 8090) ──
        location ~ ^/api/v1/(inference|nmt|asr|tts|ner|transliteration|language-detection|audio-lang-detection|speaker-diarization|language-diarization|ocr|chat)(/|$) {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers $http_access_control_request_headers;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            # Strip upstream CORS headers — inference service adds its own,
            # which would duplicate nginx's headers and cause browser rejection.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            # The "Try it now" client reads X-Correlation-ID off the response
            # to use as the Feedback API's requestId — without this, a
            # cross-origin browser request can't read that header at all.
            add_header Access-Control-Expose-Headers "X-Correlation-ID" always;

            auth_request /_auth_validate;
            auth_request_set $x_user_id                  $upstream_http_x_user_id;
            auth_request_set $x_tenant_id                $upstream_http_x_tenant_id;
            auth_request_set $x_permission_ids           $upstream_http_x_permission_ids;
            auth_request_set $x_user_plan                $upstream_http_x_user_plan;
            auth_request_set $x_auth_type                $upstream_http_x_auth_type;
            auth_request_set $x_budget_exhausted         $upstream_http_x_budget_exhausted;
            auth_request_set $x_quota_exhausted          $upstream_http_x_quota_exhausted;
            auth_request_set $x_quota_exhausted_services $upstream_http_x_quota_exhausted_services;

            proxy_pass http://inference_service;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-User-ID                 $x_user_id;
            proxy_set_header X-Tenant-ID               $x_tenant_id;
            proxy_set_header X-Permission-IDs          $x_permission_ids;
            proxy_set_header X-User-Plan               $x_user_plan;
            proxy_set_header X-Auth-Type               $x_auth_type;
            proxy_set_header X-Budget-Exhausted        $x_budget_exhausted;
            proxy_set_header X-Quota-Exhausted         $x_quota_exhausted;
            proxy_set_header X-Quota-Exhausted-Services $x_quota_exhausted_services;
        }

        # ── Protected platform-core routes (catch-all) ──
        location /api/v1/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers $http_access_control_request_headers;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth_validate;
            auth_request_set $x_user_id                  $upstream_http_x_user_id;
            auth_request_set $x_tenant_id                $upstream_http_x_tenant_id;
            auth_request_set $x_permission_ids           $upstream_http_x_permission_ids;
            auth_request_set $x_user_plan                $upstream_http_x_user_plan;
            auth_request_set $x_auth_type                $upstream_http_x_auth_type;
            auth_request_set $x_budget_exhausted         $upstream_http_x_budget_exhausted;
            auth_request_set $x_quota_exhausted          $upstream_http_x_quota_exhausted;
            auth_request_set $x_quota_exhausted_services $upstream_http_x_quota_exhausted_services;

            proxy_pass http://platform_core_service;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-User-ID                 $x_user_id;
            proxy_set_header X-Tenant-ID               $x_tenant_id;
            proxy_set_header X-Permission-IDs          $x_permission_ids;
            proxy_set_header X-User-Plan               $x_user_plan;
            proxy_set_header X-Auth-Type               $x_auth_type;
            proxy_set_header X-Budget-Exhausted        $x_budget_exhausted;
            proxy_set_header X-Quota-Exhausted         $x_quota_exhausted;
            proxy_set_header X-Quota-Exhausted-Services $x_quota_exhausted_services;
        }

        # ── Auth errors ──
        error_page 401 = @error401;
        location @error401 {
            default_type application/json;
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 401 '{"detail":"Authentication required"}';
        }

        error_page 403 = @error403;
        location @error403 {
            default_type application/json;
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 403 '{"detail":"Forbidden"}';
        }
    }
}
