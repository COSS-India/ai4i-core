groups:
- name: application-alerts
  interval: 30s
  rules:
  - alert: FullSignalPathAlert2
    expr: histogram_quantile(0.5, sum by (le, endpoint, tenant) (rate(telemetry_obsv_request_duration_seconds_bucket{endpoint=~"/.*inference.*", service="nmt-service"}[5m]))) >= 0.01
    for: 1m
    labels:
      severity: warning
      urgency: medium
      category: application
      alert_type: Latency
      scope: per_service
    annotations:
      summary: FullSignalPathAlert2
      description: 'Test all new fields: sub_category, signal, signal_metric, condition_operator plus scope, service, annotations'
